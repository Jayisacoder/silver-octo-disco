name: Architecture submission gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  architecture-evidence:
    name: Architecture evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted base code is checked out and executed. PR files are read
      # through the GitHub API as data; no PR scripts or dependencies run.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Test the trusted validator
        run: python3 -B scripts/test-architecture.py
      - name: Verify architecture evidence at the PR head commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-architecture.py --github
